name: Discover procurement sites

on:
  push:
    branches: [discover]
    paths: [probe/**, scraper/**, .github/workflows/discover.yml]

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - run: node probe/discover.mjs
      - run: |
          git config user.name "tender-scan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/discover.json
          git commit -m "Discovery results" || exit 0
          git push origin HEAD:discover
