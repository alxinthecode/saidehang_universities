name: Discover procurement sites

on:
  push:
    branches: [discover]
    paths: [probe/discover.mjs, probe/cedrat.mjs, .github/workflows/discover.yml]

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - run: timeout 30m node ${{ matrix.shard == 0 && 'probe/cedrat.mjs' || 'probe/discover.mjs' }} || true
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 5
      - if: always()
        run: |
          git config user.name "tender-scan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/cedrat.json || exit 0
          git commit -m "Cedrat catalog" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin discover && git push origin HEAD:discover && break; sleep $((RANDOM % 10 + 3)); done
