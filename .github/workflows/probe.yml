name: Probe candidate sites

on:
  push:
    branches: [probe]
    paths: [probe/probe.mjs, scraper/**, .github/workflows/probe.yml]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - run: node probe/probe.mjs
      - run: |
          git config user.name "tender-scan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/results.json
          git commit -m "Probe results" || exit 0
          git push origin HEAD:probe
