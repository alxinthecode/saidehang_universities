<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Cedrat 高校与研究所标讯</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one working column — status strip, filter bar, tender rows, then sources & keyword reference. */
:root{
  --bg:#f5f6f4; --surface:#ffffff; --fg:#1c2124; --muted:#5d666b; --line:#dfe3e1;
  --accent:#1f5f74; --accent-soft:#e3eef1;
  --ok:#2d7a4b; --ok-soft:#e4f2e9; --warn:#a2650c; --warn-soft:#f8eedd; --bad:#a63a2e; --bad-soft:#f6e3df;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121618; --surface:#1a2023; --fg:#e4e8e9; --muted:#97a2a6; --line:#2b3438;
  --accent:#6fb6cc; --accent-soft:#1d3239;
  --ok:#6cc08c; --ok-soft:#183024; --warn:#e0a548; --warn-soft:#33281a; --bad:#e8826f; --bad-soft:#36201c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121618; --surface:#1a2023; --fg:#e4e8e9; --muted:#97a2a6; --line:#2b3438;
  --accent:#6fb6cc; --accent-soft:#1d3239;
  --ok:#6cc08c; --ok-soft:#183024; --warn:#e0a548; --warn-soft:#33281a; --bad:#e8826f; --bad-soft:#36201c; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.55}
.wrap{max-width:1080px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
h1{font-size:22px;font-weight:700;margin:0;letter-spacing:.01em;text-wrap:balance}
h1 small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.hright{display:grid;gap:6px;justify-items:end}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.lang button{font:inherit;font-size:12.5px;border:0;background:transparent;color:var(--muted);padding:4px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.scanline{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.refresh{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--surface);background:var(--accent);border-radius:6px;padding:5px 12px;text-decoration:none}
.refresh::before{content:"↻";font-size:14px}
.refresh:hover{filter:brightness(1.08)}
.refresh:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#refresh-hint{max-width:34ch;text-align:right;font-family:var(--f-body)}
.fail{color:var(--bad)}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stat{background:var(--surface);padding:12px 14px}
.stat b{display:block;font-family:var(--f-mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 11px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chip:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible,.lang button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sep{width:1px;height:20px;background:var(--line)}
#q{flex:1 1 180px;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:6px 10px;font:inherit}
.list{display:grid;gap:10px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px 12px 16px;display:grid;grid-template-columns:104px 1fr auto;gap:6px 14px;position:relative}
.row.strong::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 2px 2px 0;background:var(--accent)}
.row.closed{opacity:.72}
.due{font-family:var(--f-mono);font-size:12px;line-height:1.3;font-variant-numeric:tabular-nums}
.due b{display:block;font-size:15px;font-weight:500}
.due.open b{color:var(--ok)} .due.soon b{color:var(--warn)} .due.past b{color:var(--muted)}
.main{min-width:0;display:grid;gap:5px}
.title{font-weight:500;font-size:15px;color:var(--fg);text-decoration:none;overflow-wrap:anywhere}
.title:hover{color:var(--accent);text-decoration:underline}
.orig{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12px;color:var(--muted);align-items:center}
.pill{font-size:11.5px;padding:1px 8px;border-radius:4px;border:1px solid transparent;white-space:nowrap}
.pill.school{background:var(--accent-soft);color:var(--accent)}
.pill.imp-yes{background:var(--ok-soft);color:var(--ok)}
.pill.imp-no{background:var(--bad-soft);color:var(--bad)}
.pill.imp-unk{border-color:var(--line);color:var(--muted)}
.kw{font-family:var(--f-mono);font-size:11.5px;color:var(--accent)}
.kw.weak{color:var(--muted)}
.snip{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.snip mark{background:var(--warn-soft);color:var(--fg);padding:0 2px;border-radius:2px}
.side{display:grid;gap:6px;justify-items:end;align-content:start}
.schoolsel{font-size:13px;border-radius:999px;padding:4px 10px;max-width:100%}
select{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:3px 6px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:28px;text-align:center;color:var(--muted)}
section h2{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:none}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td a{color:var(--accent)}
.kwref{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.kwbox{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.kwbox h3{margin:0 0 6px;font-size:13px}
.kwbox p{margin:0;font-family:var(--f-mono);font-size:12px;color:var(--muted);line-height:1.8}
.note{font-size:12.5px;color:var(--muted);max-width:72ch}
@media (max-width:640px){
  .row{grid-template-columns:1fr;}
  .due{display:flex;gap:8px;align-items:baseline}.due b{display:inline}
  .side{justify-items:start;grid-auto-flow:column;justify-content:start}
  .hright{justify-items:start}
}
@media (prefers-reduced-motion:no-preference){.row{transition:border-color .15s}.row:hover{border-color:var(--accent)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><small>赛得航科技 · Cedrat Technologies</small><span data-i="h1"></span></h1>
    <div class="hright">
      <div class="lang" role="group" aria-label="Language">
        <button id="lang-zh" data-lang="zh">中文</button><button id="lang-en" data-lang="en">English</button><button id="lang-fr" data-lang="fr">Français</button>
      </div>
      <div class="scanline" id="scanline"></div>
      <a class="refresh" id="refresh" href="https://github.com/alxinthecode/saidehang_universities/actions/workflows/scan.yml" target="_blank" rel="noopener" hidden><span data-i="refresh"></span></a>
      <div class="scanline" id="refresh-hint" data-i="refreshHint" hidden></div>
    </div>
  </header>

  <div class="strip">
    <div class="stat"><b id="s-open">–</b><span data-i="sOpen"></span></div>
    <div class="stat"><b id="s-strong">–</b><span data-i="sStrong"></span></div>
    <div class="stat"><b id="s-weak">–</b><span data-i="sWeak"></span></div>
    <div class="stat"><b id="s-imp">–</b><span data-i="sImp"></span></div>
    <div class="stat"><b id="s-total">–</b><span data-i="sTotal"></span></div>
  </div>

  <div class="filters">
    <button class="chip" data-f="open" id="f-open" data-i="fOpen"></button>
    <button class="chip" data-f="strong" id="f-strong" data-i="fStrong"></button>
    <button class="chip" data-f="weak" id="f-weak" data-i="fWeak"></button>
    <button class="chip" data-f="hideSkip" id="f-hideskip" data-i="fHide"></button>
    <span class="sep"></span>
    <select id="school" class="schoolsel"></select>
    <input id="q" type="search">
  </div>

  <div class="list" id="list"></div>

  <section>
    <h2 data-i="srcH"></h2>
    <div class="tablewrap"><table>
      <thead><tr><th data-i="thSchool"></th><th data-i="thPlat"></th><th data-i="thScan"></th><th data-i="thBack"></th><th data-i="thNote"></th></tr></thead>
      <tbody id="sources"></tbody>
    </table></div>
  </section>

  <section>
    <h2 data-i="ruleH"></h2>
    <div class="kwref">
      <div class="kwbox"><h3 data-i="kwStrongH"></h3><p id="kw-strong"></p></div>
      <div class="kwbox"><h3 data-i="kwWeakH"></h3><p id="kw-weak"></p></div>
    </div>
    <p class="note" data-i="ruleNote"></p>
  </section>
</div>

const state={rows:[],meta:null,f:{open:false,strong:false,weak:false,hideSkip:true},school:'',q:'',lang:'zh',loaded:false,err:''};

function save(){try{localStorage.setItem('tw-filters',JSON.stringify({f:state.f,school:state.school,lang:state.lang}))}catch(e){}}
const t=()=>T[state.lang];
const en=()=>state.lang!=='zh';
const fr=()=>state.lang==='fr';
const htmlLang=()=>({zh:'zh-CN',en:'en',fr:'fr'})[state.lang];

const sc=document.getElementById('school');
sc.onchange=()=>{state.school=sc.value;save();render()};
function fillSchools(){
  const counts={};state.rows.forEach(r=>{counts[r.school]=(counts[r.school]||0)+1});
  const name=s=>(en()?s.en:s.zh)+(counts[s.k]?' ('+counts[s.k]+')':'');
  const list=[...SCHOOLS].sort((a,b)=>(counts[b.k]||0)-(counts[a.k]||0)||name(a).localeCompare(name(b)));
  const opt=s=>'<option value="'+esc(s.k)+'">'+esc(name(s))+'</option>';
  const grp=(lab,arr)=>arr.length?'<optgroup label="'+esc(lab)+'">'+arr.map(opt).join('')+'</optgroup>':'';
  sc.innerHTML='<option value="">'+esc(t().allSchools(SCHOOLS.length))+'</option>'+
    grp(t().grpUni,list.filter(s=>s.org==='uni'))+grp(t().grpHK,list.filter(s=>s.org==='hk'))+grp(t().grpInst,list.filter(s=>s.org==='institute'));
  sc.setAttribute('aria-label',t().thSchool);
  if(state.school&&!SCHOOLS.some(s=>s.k===state.school))state.school='';
  sc.value=state.school;
}
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{const k=b.dataset.f;state.f[k]=!state.f[k];if(state.f[k]&&k==='strong')state.f.weak=false;if(state.f[k]&&k==='weak')state.f.strong=false;save();paint()});

document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{state.lang=b.dataset.lang;document.documentElement.lang=htmlLang();save();paint()});

function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const kwLabel=k=>{const m=fr()?KW_FR:KW_EN;return en()&&m[k]?(m[k]===k?k:m[k]+' ('+k+')'):k};
const schoolName=k=>{const s=SCHOOLS.find(x=>x.k===k);return s?(en()?s.en:s.zh):k};
const methodName=m=>fr()?(METHOD_FR[m]||m):en()?(METHOD_EN[m]||m):m;
const now=()=>Date.now();
const parseD=s=>{if(!s)return null;s=String(s);const t=Date.parse(s.replace(' ','T')+(s.length<=10?'T23:59:59':'')+'+08:00');return isNaN(t)?null:t};
function dueInfo(r){
  const x=parseD(r.deadline);
  if(!x) return {cls:'past',big:r.published?r.published.slice(5,10):'—',small:r.published?t().published:'',open:false};
  const d=(x-now())/864e5;
  if(d<0) return {cls:'past',big:r.deadline.slice(5,10),small:t().closed,open:false};
  return {cls:d<3?'soon':'open',big:d<1?t().today:t().days(Math.ceil(d)),small:t().due+r.deadline.slice(5,16),open:true};
}
function hl(snip,kws){let h=esc(snip);kws.forEach(k=>{h=h.split(esc(k)).join('<mark>'+esc(k)+'</mark>')});return h}

function paint(){
  document.querySelectorAll('[data-i]').forEach(el=>{const v=t()[el.dataset.i];if(typeof v==='string')el.textContent=v});
  document.getElementById('q').placeholder=t().q;
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===state.lang));
  document.querySelectorAll('[data-f]').forEach(b=>b.setAttribute('aria-pressed',!!state.f[b.dataset.f]));
  fillSchools();
  document.getElementById('kw-strong').textContent=STRONG.map(kwLabel).join(' · ');
  document.getElementById('kw-weak').textContent=WEAK.map(kwLabel).join(' · ');
  renderMeta();render();
}

function render(){
  const L=document.getElementById('list');
  const rows=state.rows.map(r=>({...r,_due:dueInfo(r)}));
  document.getElementById('s-open').textContent=state.loaded?rows.filter(r=>r._due.open&&r.status!=='skip').length:'–';
  document.getElementById('s-strong').textContent=state.loaded?rows.filter(r=>r.tier==='strong').length:'–';
  document.getElementById('s-weak').textContent=state.loaded?rows.filter(r=>r.tier!=='strong').length:'–';
  document.getElementById('s-imp').textContent=state.loaded?rows.filter(r=>r.imports==='允许').length:'–';
  document.getElementById('s-total').textContent=state.loaded?rows.length:'–';
  if(state.err){L.innerHTML='<div class="empty">'+esc(state.err)+'</div>';return}
  if(!state.loaded){L.innerHTML='<div class="empty">'+esc(t().loading)+'</div>';return}
  if(!rows.length){L.innerHTML='<div class="empty">'+esc(t().none)+'</div>';return}
  const v=rows.filter(r=>{
    if(state.f.open&&!r._due.open)return false;
    if(state.f.strong&&r.tier!=='strong')return false;
    if(state.f.weak&&r.tier==='strong')return false;
    if(state.f.hideSkip&&r.status==='skip')return false;
    if(state.school&&r.school!==state.school)return false;
    if(state.q){const kws=[...(r.strong||[]),...(r.weak||[])];const hay=[r.title,r.titleEn,r.titleFr,r.no,r.snippet,r.snippetEn,r.snippetFr,...kws,...kws.map(k=>KW_EN[k]||''),...kws.map(k=>KW_FR[k]||'')].join(' ').toLowerCase();if(!hay.includes(state.q))return false}
    return true});
  v.sort((a,b)=>(b._due.open-a._due.open)||((parseD(b.published)||0)-(parseD(a.published)||0)));
  if(!v.length){L.innerHTML='<div class="empty">'+esc(t().noMatch)+'</div>';return}
  L.innerHTML=v.map(r=>{
    const imp=r.imports==='允许'?'<span class="pill imp-yes">'+t().impYes+'</span>':r.imports==='不接受'?'<span class="pill imp-no">'+t().impNo+'</span>':'<span class="pill imp-unk">'+t().impUnk+'</span>';
    const kwAll=[...(r.strong||[]),...(r.weak||[])];
    const kws=[...(r.strong||[]).map(k=>'<span class="kw">'+esc(kwLabel(k))+'</span>'),...(r.weak||[]).map(k=>'<span class="kw weak">'+esc(kwLabel(k))+'</span>')].join(' ');
    const tr=fr()?(r.titleFr||r.titleEn):r.titleEn;
    const title=en()&&tr?tr:r.title;
    const budget=fr()?(r.budgetFr||r.budgetEn||r.budget):en()?(r.budgetEn||r.budget):r.budget;
    const note=fr()?(r.noteFr||r.noteEn||r.note):en()?(r.noteEn||r.note):r.note;
    const snipT=fr()?(r.snippetFr||r.snippetEn):r.snippetEn;
    const snip=en()&&snipT?esc(snipT):(r.snippet&&r.snippet.length>r.title.length+4?hl(r.snippet,kwAll):'');
    const opts=STATUS_KEYS.map(k=>'<option value="'+k+'"'+((r.status||'new')===k?' selected':'')+'>'+t().status[k]+'</option>').join('');
    return '<article class="row '+(r.tier==='strong'?'strong ':'')+(r._due.open?'':'closed')+'">'+
      '<div class="due '+r._due.cls+'"><b>'+esc(r._due.big)+'</b>'+esc(r._due.small)+'</div>'+
      '<div class="main"><a class="title" href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(title)+'</a>'+
      (en()&&tr?'<div class="orig">'+esc(r.title)+'</div>':'')+
      '<div class="meta"><span class="pill school">'+esc(schoolName(r.school))+'</span>'+imp+
      (r.method?'<span>'+esc(methodName(r.method))+'</span>':'')+(budget?'<span>'+esc(t().budget+budget)+'</span>':'')+
      (r.no?'<span class="kw weak">'+esc(r.no)+'</span>':'')+'<span>'+kws+'</span></div>'+
      (snip?'<div class="snip">'+snip+'</div>':'')+
      (note?'<div class="snip">'+esc(t().note+note)+'</div>':'')+'</div>'+
      '<div class="side"><select id="st-'+esc(r._id)+'" data-id="'+esc(r._id)+'" aria-label="'+esc(t().statusLabel)+'"'+(canWrite?'':' disabled')+'>'+opts+'</select>'+
      '<span class="scanline">'+esc((r.published||'').slice(0,10))+'</span></div></article>'}).join('');
  L.querySelectorAll('select[data-id]').forEach(s=>s.onchange=async e=>{
    const id=e.target.dataset.id;if(!db)return;
    try{await db.collection('notices').doc(id).update({status:e.target.value})}
    catch(err){if(err&&err.code==='invalid_argument'){canWrite=false;render()}}});
}
function renderMeta(){
  const m=state.meta;const tb=document.getElementById('sources');const line=document.getElementById('scanline');
  const link=u=>'<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(u.replace('https://',''))+'</a>';
  if(!m){line.textContent=t().notYet;tb.innerHTML=SCHOOLS.map(s=>'<tr><td>'+esc(en()?s.en:s.zh)+'</td><td>'+link(s.url)+'</td><td class="num">–</td><td class="num">–</td><td></td></tr>').join('');return}
  line.textContent=t().lastRun+(m.lastRun||'').replace('T',' ').slice(0,16)+t().bj;
  const cov=m.coverage||{};
  tb.innerHTML=SCHOOLS.map(s=>{const c=cov[s.k]||{};const lr=(m.lastResults||[]).find(x=>x.school===s.k);const fail=lr&&!lr.ok?'<div class="fail">'+esc(t().lastFail+(lr.error||''))+'</div>':'';return '<tr><td>'+esc(en()?s.en:s.zh)+'</td><td>'+link(s.url)+'</td><td class="num">'+(c.scanned!=null?c.scanned+t().items:'–')+'</td><td class="num">'+esc(c.oldest||'–')+'</td><td>'+esc(fr()?(c.noteFr||c.noteEn||c.note||''):en()?(c.noteEn||c.note||''):(c.note||''))+fail+'</td></tr>'}).join('')+
    (m.extra||[]).map(x=>'<tr><td>'+esc(en()?(EXTRA_SCHOOL_EN[x.school]||x.school):x.school)+'</td><td><a href="'+esc(x.url)+'" target="_blank" rel="noopener">'+esc(fr()?(x.labelFr||x.labelEn||x.label):en()?(x.labelEn||x.label):x.label)+'</a></td><td class="num">–</td><td class="num">–</td><td>'+esc(fr()?(x.noteFr||x.noteEn||x.note):en()?(x.noteEn||x.note):x.note)+'</td></tr>').join('');
}
document.documentElement.lang=htmlLang();
paint();

(async()=>{
  try{db=window.claude?await window.claude.use('db'):null}catch(e){db=null}
  if(!db){
    // Standalone (e.g. GitHub Pages): read the snapshot in data/; status is read-only here.
    canWrite=false;
    document.getElementById('refresh').hidden=false;document.getElementById('refresh-hint').hidden=false;
    try{
      const [n,m]=await Promise.all([fetch('data/notices.json',{cache:'no-store'}).then(r=>r.json()),fetch('data/meta.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null)]);
      try{const sj=await fetch('scraper/sites.json',{cache:'no-store'}).then(r=>r.ok?r.json():null);
        if(Array.isArray(sj)&&sj.length)SCHOOLS=sj.map(x=>({k:x.key,zh:x.zh,en:x.en,org:x.org||'uni',url:new URL(x.url).origin}));}catch(e){}
      state.rows=n;state.meta=m;state.loaded=true;state.err='';paint();
    }catch(e){state.err=t().noDb;render()}
    return;
  }
  try{const u=await window.claude.use('user');const w=u?await u.can('data.write'):null;if(w===false)canWrite=false}catch(e){}
  db.collection('notices').onSnapshot(s=>{state.rows=s.docs.map(d=>({...d.data(),_id:d.id}));state.loaded=true;state.err='';render()},e=>{state.err=t().readErr(e.code);render()});
  db.doc('meta/scan').onSnapshot(s=>{state.meta=s.exists?s.data():null;renderMeta()});
})();
</script>
</body>
</html>
